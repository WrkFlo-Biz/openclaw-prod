name: Build and Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to deploy (e.g., v5). Leave empty to use commit SHA."
        required: false
        default: ""
      skipBuild:
        description: "Skip build/push and only deploy the specified image tag."
        required: false
        default: "false"

concurrency:
  group: openclaw-prod-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_CONTAINER_REGISTRY: wrkfloopenclawacr
  RESOURCE_GROUP: openclaw-rg
  VM_NAME: openclaw-gateway-vm
  CONTAINER_IMAGE: openclaw
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.imageTag || github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skipBuild != 'true' }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "ACR build attempt ${attempt}/2"
            if az acr build \
              --registry "${{ env.AZURE_CONTAINER_REGISTRY }}" \
              --image "${{ env.CONTAINER_IMAGE }}:${{ github.sha }}" \
              --image "${{ env.CONTAINER_IMAGE }}:latest" \
              .; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "ACR build failed after retries" >&2
              exit 1
            fi
            sleep 20
          done

      - name: Update VM runtime image and restart service
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "Deploying ${IMAGE_REF} to ${{ env.VM_NAME }}"

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail
          ENV_FILE=/etc/openclaw/openclaw.env
          IMAGE_REF='${IMAGE_REF}'
          if sudo grep -q '^OPENCLAW_IMAGE=' "\${ENV_FILE}"; then
            sudo sed -i "s|^OPENCLAW_IMAGE=.*|OPENCLAW_IMAGE=\${IMAGE_REF}|" "\${ENV_FILE}"
          else
            echo "OPENCLAW_IMAGE=\${IMAGE_REF}" | sudo tee -a "\${ENV_FILE}" >/dev/null
          fi
          sudo systemctl daemon-reload
          sudo systemctl restart openclaw-gateway.service
          sleep 8
          sudo systemctl is-active openclaw-gateway.service
          EOF
          )

          az vm run-command invoke \
            -g "${{ env.RESOURCE_GROUP }}" \
            -n "${{ env.VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "$REMOTE_SCRIPT" \
            --query 'value[0].message' -o tsv

      - name: Health Check (VM gateway)
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'EOF'
          set -euo pipefail
          TOKEN="$(sudo awk -F= '/^OPENCLAW_GATEWAY_TOKEN=/{print $2}' /etc/openclaw/openclaw.env | tr -d '\r\n')"
          AUTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:18789/__openclaw__/canvas/management.html || true)"
          if [ "${AUTH_CODE}" != "200" ]; then
            echo "Gateway health check failed: canvas auth code ${AUTH_CODE}" >&2
            sudo journalctl -u openclaw-gateway.service -n 120 --no-pager || true
            exit 1
          fi
          echo "Gateway health check passed (canvas_auth=${AUTH_CODE})"
          EOF
          )

          az vm run-command invoke \
            -g "${{ env.RESOURCE_GROUP }}" \
            -n "${{ env.VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "$REMOTE_SCRIPT" \
            --query 'value[0].message' -o tsv
