name: Build and Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to deploy (e.g., v5). Leave empty to use commit SHA."
        required: false
        default: ""
      skipBuild:
        description: "Skip build/push and only deploy the specified image tag."
        required: false
        default: "false"

env:
  AZURE_CONTAINER_REGISTRY: wrkfloopenclawacr
  RESOURCE_GROUP: openclaw-rg
  CONTAINER_GROUP_NAME: openclaw-aci
  CONTAINER_IMAGE: openclaw
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.imageTag || github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Login to ACR
        run: |
          az acr login \
            --name ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skipBuild != 'true' }}
        run: |
          docker buildx build --platform linux/amd64 -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_IMAGE }}:${{ github.sha }} --push .
          docker buildx build --platform linux/amd64 -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_IMAGE }}:latest --push .

      - name: Deploy to Azure Container Instances
        run: |
          az container delete --yes \
            --name ${{ env.CONTAINER_GROUP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} || true
          az container create \
            --name ${{ env.CONTAINER_GROUP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_IMAGE }}:${{ env.IMAGE_TAG }} \
            --os-type Linux \
            --restart-policy Always \
            --cpu 1 --memory 2 \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --environment-variables \
              AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }} \
              AZURE_OPENAI_DEPLOYMENT=${{ secrets.AZURE_OPENAI_DEPLOYMENT }} \
              AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION }} \
            --secure-environment-variables \
              AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }} \
              TELEGRAM_BOT_TOKEN_DEFAULT=${{ secrets.TELEGRAM_BOT_TOKEN_DEFAULT }} \
              TELEGRAM_BOT_TOKEN_MO2DRKBOT=${{ secrets.TELEGRAM_BOT_TOKEN_MO2DRKBOT }} \
              OPENCLAW_GATEWAY_TOKEN=${{ secrets.OPENCLAW_GATEWAY_TOKEN }}

      - name: Health Check (ACI)
        run: |
          echo "Waiting for container to stabilize..."
          for i in {1..30}; do
            state=$(az container show \
              --name ${{ env.CONTAINER_GROUP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "containers[0].instanceView.currentState.state" -o tsv || true)
            detail=$(az container show \
              --name ${{ env.CONTAINER_GROUP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "containers[0].instanceView.currentState.detailStatus" -o tsv || true)
            restarts=$(az container show \
              --name ${{ env.CONTAINER_GROUP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "containers[0].instanceView.restartCount" -o tsv || true)
            echo "state=$state detail=$detail restarts=$restarts"
            if [ "$state" = "Running" ] && [ "$restarts" = "0" ]; then
              echo "Container is healthy."
              exit 0
            fi
            if echo "$detail" | grep -q "CrashLoopBackOff"; then
              echo "Container crash looping." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for container to become healthy." >&2
          exit 1
