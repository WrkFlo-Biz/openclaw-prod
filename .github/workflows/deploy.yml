name: Build and Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to deploy (e.g., v5). Leave empty to use commit SHA."
        required: false
        default: ""
      skipBuild:
        description: "Skip build/push and only deploy the specified image tag."
        required: false
        default: "false"

env:
  AZURE_CONTAINER_REGISTRY: wrkfloopenclawacr
  RESOURCE_GROUP: openclaw-rg
  CONTAINER_APPS_ENVIRONMENT: openclaw-env
  CONTAINER_APP_NAME: openclaw-gateway
  CONTAINER_IMAGE: openclaw
  GATEWAY_PORT: "18789"
  GATEWAY_BIND: lan
  GITHUB_REPO: Wrk-Flo/openclaw-prod
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.imageTag || github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Login to ACR
        run: |
          az acr login \
            --name ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skipBuild != 'true' }}
        run: |
          docker buildx build --platform linux/amd64 -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_IMAGE }}:${{ github.sha }} --push .
          docker buildx build --platform linux/amd64 -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_IMAGE }}:latest --push .

      - name: Deploy to Azure Container Apps (HTTPS + WebSockets)
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade

          APP_NAME="${{ env.CONTAINER_APP_NAME }}"
          RG="${{ env.RESOURCE_GROUP }}"
          ENV_NAME="${{ env.CONTAINER_APPS_ENVIRONMENT }}"
          REGISTRY_SERVER="${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io"
          IMAGE="${REGISTRY_SERVER}/${{ env.CONTAINER_IMAGE }}:${{ env.IMAGE_TAG }}"

          # ACA can get stuck in provisioning after a partial create; recreate for a clean deploy.
          az containerapp delete -g "$RG" -n "$APP_NAME" --yes || true

          az containerapp create \
            -g "$RG" -n "$APP_NAME" \
            --environment "$ENV_NAME" \
            --image "$IMAGE" \
            --ingress external \
            --target-port "${{ env.GATEWAY_PORT }}" \
            --transport auto \
            --cpu 1.0 --memory 2.0Gi \
            --min-replicas 1 --max-replicas 1 \
            --registry-server "$REGISTRY_SERVER" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --secrets \
              azure-openai-api-key='${{ secrets.AZURE_OPENAI_API_KEY }}' \
              telegram-bot-token-default='${{ secrets.TELEGRAM_BOT_TOKEN_DEFAULT }}' \
              telegram-bot-token-mo2drkbot='${{ secrets.TELEGRAM_BOT_TOKEN_MO2DRKBOT }}' \
              gh-token='${{ secrets.GH_TOKEN }}' \
              openai-api-key='${{ secrets.OPENAI_API_KEY }}' \
              openclaw-gateway-token='${{ secrets.OPENCLAW_GATEWAY_TOKEN }}' \
            --env-vars \
              AZURE_OPENAI_ENDPOINT='${{ secrets.AZURE_OPENAI_ENDPOINT }}' \
              AZURE_OPENAI_DEPLOYMENT='${{ secrets.AZURE_OPENAI_DEPLOYMENT }}' \
              AZURE_OPENAI_API_VERSION='${{ secrets.AZURE_OPENAI_API_VERSION }}' \
              OPENCLAW_GATEWAY_BIND='${{ env.GATEWAY_BIND }}' \
              OPENCLAW_GATEWAY_PORT='${{ env.GATEWAY_PORT }}' \
              GITHUB_REPO='${{ env.GITHUB_REPO }}' \
              AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key \
              TELEGRAM_BOT_TOKEN_DEFAULT=secretref:telegram-bot-token-default \
              TELEGRAM_BOT_TOKEN_MO2DRKBOT=secretref:telegram-bot-token-mo2drkbot \
              GH_TOKEN=secretref:gh-token \
              OPENAI_API_KEY=secretref:openai-api-key \
              OPENCLAW_GATEWAY_TOKEN=secretref:openclaw-gateway-token

          FQDN="$(az containerapp show -g "$RG" -n "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Container App FQDN: $FQDN"

      - name: Health Check (Container Apps)
        run: |
          APP_NAME="${{ env.CONTAINER_APP_NAME }}"
          RG="${{ env.RESOURCE_GROUP }}"

          echo "Waiting for HTTPS health endpoint..."
          FQDN="$(az containerapp show -g "$RG" -n "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in {1..60}; do
            if curl -fsS "https://${FQDN}/api/health" >/dev/null; then
              echo "Healthy: https://${FQDN}"
              exit 0
            fi
            echo "Not ready yet (${i}/60): https://${FQDN}/api/health"
            sleep 5
          done

          echo "Timed out waiting for Container App health check." >&2
          az containerapp logs show -g "$RG" -n "$APP_NAME" --tail 200 || true
          exit 1
