version: '3.8'

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - openclaw-data:/data/openclaw
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For docker operations
    ports:
      - "8080:8080"  # Webhook endpoint
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-data:
    driver: local

networks:
  openclaw-network:
    driver: bridge
